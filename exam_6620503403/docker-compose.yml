name: ${COMPOSE_PROJECT_NAME:-dw-exam-student}
services:
  app:
    profiles: [local-mysql, university-mysql, neon]
    build:
      context: .
      args:
        DB_PROVIDER: ${DB_PROVIDER:-mysql}
    environment:
      APP_MODE: ${APP_MODE:-exam}
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      DATABASE_URL: ${DATABASE_URL}
    ports: ["${HOST_PORT:-3000}:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  mysql:
    profiles: [local-mysql]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dw_exam}
      MYSQL_USER: ${MYSQL_USER:-dw_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  phpmyadmin:
    profiles: [local-mysql]
    image: phpmyadmin:5
    environment: { PMA_HOST: mysql }
    ports: ["127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"]
    depends_on: { mysql: { condition: service_healthy } }
volumes: { mysql_data: {} }
